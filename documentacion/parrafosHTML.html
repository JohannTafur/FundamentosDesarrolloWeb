<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Etiquetas Inline dentro de un Párrafo</title>
  </head>
  <body>
    <!-- Párrafo con múltiples etiquetas inline válidas -->
    <p><b>Mi primer página HTML</b></p>
    <!-- Texto en negrita sin énfasis semántico -->

    <p><strong>segundo párrafo</strong></p>
    <!-- Texto en negrita con énfasis semántico (importancia) -->

    <p><i>tercer párrafo</i></p>
    <!-- Texto en cursiva sin énfasis semántico -->

    <p><em>cuarto párrafo</em></p>
    <!-- Texto enfatizado semánticamente (énfasis lógico) -->

    <p><small>quinto párrafo</small></p>
    <!-- Texto reducido (letra más pequeña) -->

    <p><mark>sexto párrafo</mark></p>
    <!-- Texto resaltado con fondo amarillo por defecto -->

    <p><del>séptimo párrafo</del></p>
    <!-- Texto tachado (indica eliminación) -->

    <p><ins>octavo párrafo</ins></p>
    <!-- Texto insertado (subrayado por defecto, indica adición) -->

    <p>noveno <sub>p</sub>árrafo H<sub>2</sub>O</p>
    <!-- Texto en subíndice (sub) útil para fórmulas químicas -->

    <p>décimo <sup>p</sup>árrafo</p>
    <!-- Texto en superíndice (sup), útil para potencias o anotaciones -->

    Este texto está antes del salto.<br />
    Y este después del salto de línea.
    <!-- Salto de línea -->

    <pre>
    Este es 
    nuestro nuevo párrafo
    </pre>
    <!-- Etiqueta <pre> (preformateado):
         - Respeta los saltos de línea y espacios exactamente como se escriben.
         - Muy útil para mostrar código o texto alineado.
    -->
  </body>
</html>
